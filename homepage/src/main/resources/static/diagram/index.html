<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 외부 연결 차단: 모든 리소스는 같은 폴더에서만 불러온다 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; form-action 'none'">
  <title>업무 도식화 도구</title>
  <link rel="stylesheet" href="css/diagram.css">
</head>
<body>
<header class="topbar no-print">
  <div class="brand">
    <strong>업무 도식화 도구</strong>
    <span class="badge-safe" title="외부 AI·인터넷·CDN을 사용하지 않으며 입력한 업무 정보는 이 PC 밖으로 전송되지 않습니다.">오프라인 · 외부 전송 없음</span>
  </div>
  <div class="top-actions">
    <button type="button" id="btnSample">예시 불러오기</button>
    <button type="button" id="btnNew">새로 작성</button>
    <button type="button" id="btnSaveProject">작업 파일 저장</button>
    <label class="btn-like">작업 파일 열기<input type="file" id="fileProject" accept=".json,application/json" hidden></label>
  </div>
</header>

<main class="layout">
  <!-- ===================== 입력 영역 ===================== -->
  <section class="panel input-panel no-print" aria-label="입력">
    <div class="field">
      <label for="title">업무명</label>
      <input id="title" data-info="title" placeholder="예: 반품 신청 처리">
    </div>

    <div class="field">
      <label for="requirement">① 고객 요구사항 <em class="req">필수</em></label>
      <textarea id="requirement" data-info="requirement" rows="9" placeholder="업무 흐름을 한 줄에 하나씩 적어 주세요.&#10;예)&#10;고객이 반품 신청 화면에서 사유를 입력한다.&#10;필수 항목이 입력되었으면 신청을 접수한다.&#10;아니면 다시 입력하도록 안내한다.&#10;# 업무 단위 제목 (흐름을 나눌 때)"></textarea>
      <p class="hint">“~하면 / ~인 경우”는 조건(마름모)으로, 다음 줄의 “아니면 …”은 ‘아니오’ 처리로 정리됩니다. “# 제목” 줄은 업무 단위를 나눕니다.</p>
    </div>

    <div class="field">
      <label for="devNotes">② 개발자 고려사항</label>
      <textarea id="devNotes" data-info="devNotes" rows="6" placeholder="예)&#10;[3] 반품 신청 저장 시 RETURN_REQ 테이블 INSERT&#10;택배사 API 호출 실패 시 3회 재시도&#10;승인 화면은 ROLE_CS 권한자만 접근"></textarea>
      <p class="hint">“[번호]” 또는 “3단계:”로 시작하면 해당 단계에 연결됩니다. 개발자 설명 모드에서만 표시됩니다.</p>
    </div>

    <details class="more" id="moreInfo">
      <summary>추가 정보 입력 (선택)</summary>
      <div class="grid2">
        <div class="field"><label for="owners">업무 담당자</label><input id="owners" data-info="owners" placeholder="고객, 담당자, 시스템"></div>
        <div class="field"><label for="roles">사용자 역할</label><input id="roles" data-info="roles" placeholder="회원, CS 담당자"></div>
      </div>
      <div class="field"><label for="screens">관련 화면명</label><input id="screens" data-info="screens" placeholder="주문내역 화면, 반품 신청 화면"></div>
      <div class="grid2">
        <div class="field"><label for="startCond">업무 시작 조건</label><input id="startCond" data-info="startCond" placeholder="배송 완료된 주문이 있음"></div>
        <div class="field"><label for="endCond">업무 종료 조건</label><input id="endCond" data-info="endCond" placeholder="반품 접수 완료 안내"></div>
      </div>
      <div class="field">
        <label for="steps">업무 단계 (입력 시 고객 요구사항 대신 사용)</label>
        <textarea id="steps" data-info="steps" rows="4" placeholder="한 줄에 한 단계씩"></textarea>
      </div>
      <div class="field">
        <label for="conditions">조건 및 예외사항</label>
        <textarea id="conditions" data-info="conditions" rows="4" placeholder="조건 → 결과&#10;배송 후 7일 초과 → 반품 불가 안내"></textarea>
      </div>
      <div class="grid2">
        <div class="field"><label for="before">변경 전 업무 방식</label><textarea id="before" data-info="before" rows="4" placeholder="한 줄에 한 단계씩"></textarea></div>
        <div class="field"><label for="after">변경 후 업무 방식</label><textarea id="after" data-info="after" rows="4" placeholder="한 줄에 한 단계씩"></textarea></div>
      </div>
    </details>

    <div class="extract-bar">
      <button type="button" class="primary" id="btnExtract">단계 자동 정리 → 도식 생성</button>
      <span class="hint" id="extractMsg"></span>
    </div>

    <div class="steps-head">
      <h2>단계 편집 <small id="stepCount"></small></h2>
      <div>
        <button type="button" id="btnAddStep">+ 단계 추가</button>
      </div>
    </div>
    <p class="hint">자동 정리된 결과를 직접 고칠 수 있습니다. 고치는 즉시 도식에 반영됩니다.</p>
    <ol id="stepList" class="step-list"></ol>
  </section>

  <!-- ===================== 결과 영역 ===================== -->
  <section class="panel output-panel" aria-label="결과">
    <div class="controls no-print">
      <div class="ctl">
        <span class="ctl-label">도식 유형</span>
        <div class="seg" id="kindSeg" role="radiogroup">
          <button type="button" data-kind="process" class="on">업무 처리 흐름도</button>
          <button type="button" data-kind="role">역할별 업무 흐름도</button>
          <button type="button" data-kind="screen">화면 이동 흐름도</button>
          <button type="button" data-kind="compare">변경 전·후 비교도</button>
          <button type="button" data-kind="condition">조건별 처리 결과</button>
        </div>
      </div>
      <div class="ctl">
        <span class="ctl-label">설명 모드</span>
        <div class="seg" id="modeSeg" role="radiogroup">
          <button type="button" data-mode="customer" class="on">고객 설명 모드</button>
          <button type="button" data-mode="developer">개발자 설명 모드</button>
          <button type="button" data-mode="both">두 모드 비교</button>
        </div>
      </div>
      <div class="ctl opts">
        <label>한 줄 글자 수 <input type="number" id="optPerLine" min="8" max="40" value="14"></label>
        <label>한 장 최대 단계 <input type="number" id="optMaxNodes" min="3" max="40" value="10"></label>
        <label><input type="checkbox" id="optSummarize" checked> 시스템 내부 처리 요약(고객 모드)</label>
      </div>
      <div class="ctl actions">
        <button type="button" id="btnSvgAll">SVG 저장</button>
        <button type="button" id="btnPngAll">PNG 저장</button>
        <button type="button" id="btnMmdAll">Mermaid 파일 저장</button>
        <button type="button" id="btnCopyAll">코드 복사</button>
        <button type="button" id="btnPrint">인쇄 / PDF 저장</button>
      </div>
    </div>

    <div id="sheets" class="sheets"></div>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="lib/mermaid.min.js"></script>
<script src="js/model.js"></script>
<script src="js/generator.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
